<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月圓之夜 · 互動故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161829; --bg2:#1f2140; --card:#20223d;
    --moon:#e8c872; --lantern:#c8553d; --ink:#f2e9d8; --ink-dim:#b9b3c9; --border:#3a3d63;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; background:var(--bg); font-family:'Noto Serif TC', serif; color:var(--ink); }
  body{ position:relative; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:48px 20px; overflow-x:hidden; }
  .sky{ position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 82% 12%, rgba(232,200,114,0.32), rgba(232,200,114,0) 45%),
      radial-gradient(ellipse at 50% 100%, var(--bg2), var(--bg) 70%); }
  .moon{ position:fixed; top:7%; right:9%; width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6da, var(--moon) 60%, #c9a24f 100%);
    box-shadow:0 0 70px 12px rgba(232,200,114,0.35); z-index:0; }
  .stars{ position:fixed; inset:0; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 12%, #fff, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 85% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 92% 25%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, #fff, transparent);
    opacity:0.6; animation:twinkle 5s ease-in-out infinite alternate; }
  .ambient-effects{position:fixed;inset:0;z-index:.5;overflow:hidden;pointer-events:none;}
  .floating-lantern{position:absolute;bottom:-100px;font-size:34px;opacity:0;filter:drop-shadow(0 0 12px rgba(232,200,114,.55));animation:lantern-rise 24s linear infinite;}
  .floating-lantern:nth-child(1){left:5%;animation-delay:-3s;animation-duration:27s;font-size:30px}
  .floating-lantern:nth-child(2){right:6%;animation-delay:-15s;animation-duration:30s;font-size:38px}
  .floating-lantern:nth-child(3){left:15%;animation-delay:-20s;animation-duration:34s;font-size:24px}
  .floating-lantern:nth-child(4){right:16%;animation-delay:-8s;animation-duration:32s;font-size:27px}
  @keyframes lantern-rise{0%{transform:translate3d(0,0,0) rotate(-5deg);opacity:0}8%{opacity:.58}45%{transform:translate3d(18px,-55vh,0) rotate(5deg)}90%{opacity:.5}100%{transform:translate3d(-12px,-120vh,0) rotate(-4deg);opacity:0}}
  .firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffeaa3;box-shadow:0 0 12px 3px rgba(255,226,133,.72);opacity:0;animation:firefly-drift 7s ease-in-out infinite}
  .firefly:nth-of-type(5){left:11%;top:68%;animation-delay:-2s}.firefly:nth-of-type(6){right:13%;top:36%;animation-delay:-5s}.firefly:nth-of-type(7){left:20%;top:25%;animation-delay:-3s}.firefly:nth-of-type(8){right:21%;top:76%;animation-delay:-1s}
  @keyframes firefly-drift{0%,100%{transform:translate(0,10px);opacity:0}40%,60%{transform:translate(14px,-22px);opacity:.85}}
  .osmanthus{position:absolute;bottom:-24px;color:#e8c872;font-size:15px;opacity:0;animation:petal-drift 19s linear infinite}
  .osmanthus:nth-last-child(3){left:28%;animation-delay:-9s}.osmanthus:nth-last-child(2){left:70%;animation-delay:-15s}.osmanthus:nth-last-child(1){left:46%;animation-delay:-4s}
  @keyframes petal-drift{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:.48}100%{transform:translate3d(42px,-110vh,0) rotate(180deg);opacity:0}}
  @keyframes twinkle{ from{opacity:.35;} to{opacity:.75;} }
  .decor{ position:fixed; top:0; bottom:0; width:180px; z-index:0; pointer-events:none; }
  .decor.left{ left:0; } .decor.right{ right:0; }
  .decor svg{ position:absolute; opacity:.55; animation:float 7s ease-in-out infinite; }
  .decor.left svg:nth-child(1){ top:8%;  left:18px; width:64px; animation-delay:0s; }
  .decor.left svg:nth-child(2){ top:42%; left:46px; width:52px; animation-delay:1.5s; }
  .decor.left svg:nth-child(3){ top:76%; left:10px; width:58px; animation-delay:3s; }
  .decor.right svg:nth-child(1){ top:14%; right:20px; width:58px; animation-delay:.8s; }
  .decor.right svg:nth-child(2){ top:48%; right:44px; width:66px; animation-delay:2.2s; }
  .decor.right svg:nth-child(3){ top:80%; right:14px; width:50px; animation-delay:3.6s; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @media (max-width: 1180px){ .decor{ display:none; } }

  main{ position:relative; z-index:1; width:100%; max-width:760px; }
  .card{ background:linear-gradient(180deg, var(--card), #191b34); border:1px solid var(--border); border-radius:20px;
    padding:52px 56px; box-shadow:0 24px 70px rgba(0,0,0,0.45); animation:fadein .5s ease both; }
  @keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  h1{ margin:0 0 8px; font-size:1.9rem; font-weight:700; letter-spacing:.04em; color:var(--moon); }
  .subtitle{ margin:0 0 8px; font-size:.92rem; color:var(--ink-dim); }
  .unlock-line{ margin:0 0 26px; font-size:.85rem; color:var(--lantern); }
  .story-text{ font-size:1.14rem; line-height:1.95; white-space:pre-line; margin-bottom:30px; }
  .choices{ display:flex; flex-direction:column; gap:14px; }
  button.choice{ text-align:left; background:#262848; color:var(--ink); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; font-family:inherit; font-size:1.04rem; line-height:1.6; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .15s ease; }
  button.choice:hover{ border-color:var(--moon); background:#2c2f58; transform:translateX(3px); }
  button.choice:focus-visible{ outline:2px solid var(--moon); outline-offset:2px; }
  .ending-tag{ display:inline-block; font-size:.8rem; color:var(--lantern); border:1px solid var(--lantern);
    border-radius:999px; padding:4px 14px; margin-bottom:18px; letter-spacing:.06em; }
  button.restart{ margin-top:4px; width:100%; background:var(--lantern); color:#fff6ea; border:none; border-radius:12px;
    padding:15px 18px; font-family:inherit; font-size:1.05rem; cursor:pointer; transition:filter .15s ease; }
  button.restart:hover{ filter:brightness(1.1); }
  .step-label{ font-size:.8rem; color:var(--ink-dim); margin-bottom:16px; letter-spacing:.05em; }
  .stats-link{ background:none; border:none; color:var(--ink-dim); text-decoration:underline; cursor:pointer;
    font-family:inherit; font-size:.85rem; padding:0; margin-bottom:26px; }
  .stats-link:hover{ color:var(--moon); }
  .stat-row{ margin-bottom:14px; }
  .stat-row .stat-label{ display:flex; justify-content:space-between; font-size:.92rem; margin-bottom:5px; }
  .stat-row .stat-bar-bg{ background:var(--border); border-radius:6px; height:10px; overflow:hidden; }
  .stat-row .stat-bar-fill{ background:var(--moon); height:100%; border-radius:6px; transition:width .5s ease; }
  .stats-note{ color:var(--ink-dim); font-size:.85rem; margin-top:22px; }
  .nav-links{ display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:26px; } .nav-links .stats-link{ margin-bottom:0; }
  details.fold{ border:1px solid var(--border); border-radius:12px; background:#191b34; margin:10px 0; }
  details.fold > summary{ cursor:pointer; padding:12px 15px; color:var(--ink-dim); font-size:.92rem; list-style:none; }
  details.fold > summary::-webkit-details-marker{ display:none; }
  details.fold > summary::before{ content:'📁 '; } details.fold[open] > summary::before{ content:'📂 '; }
  details.fold > summary:hover{ color:var(--moon); } details.fold > summary:focus-visible{ outline:2px solid var(--moon); border-radius:12px; }
  details.fold .fold-body{ padding:0 15px 14px; color:var(--ink-dim); font-size:.92rem; line-height:1.75; }
  details.recap{ margin:0 0 22px; }
  .recap-item{ padding:10px 0; border-top:1px dashed var(--border); white-space:pre-line; }
  .recap-item .picked{ display:block; margin-top:6px; color:var(--moon); }
  .collection{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:18px 0 22px; }
  .ending-card{ border:1px solid var(--border); border-radius:12px; padding:13px 15px; background:#191b34; font-size:.9rem; line-height:1.6; }
  .ending-card strong{ display:block; color:var(--moon); } .ending-card small{ color:var(--ink-dim); }
  .ending-card.locked{ opacity:.55; border-style:dashed; } .ending-card.locked strong{ color:var(--ink-dim); }
  .wish-input{ width:100%; background:#161829; color:var(--ink); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; font-family:inherit; font-size:1.02rem; margin-bottom:14px; }
  .wish-input:focus-visible{ outline:2px solid var(--moon); }
  .ending-scene{ position:relative; height:150px; margin:-18px 0 14px; overflow:hidden; }
  .ending-scene .spark{ position:absolute; left:50%; top:74%; width:7px; height:7px; border-radius:50%; background:var(--moon); box-shadow:0 0 14px var(--moon); animation:rise 1.5s ease-out both; }
  .ending-scene .spark:nth-child(1){--x:-90px;--y:-65px;animation-delay:.05s}.ending-scene .spark:nth-child(2){--x:-60px;--y:-110px;animation-delay:.12s}.ending-scene .spark:nth-child(3){--x:-30px;--y:-78px;animation-delay:.2s}.ending-scene .spark:nth-child(4){--x:0px;--y:-125px;animation-delay:.28s}.ending-scene .spark:nth-child(5){--x:30px;--y:-80px;animation-delay:.36s}.ending-scene .spark:nth-child(6){--x:60px;--y:-108px;animation-delay:.44s}.ending-scene .spark:nth-child(7){--x:90px;--y:-65px;animation-delay:.52s}
  @keyframes rise{from{transform:translate(0,0) scale(.2);opacity:0}to{transform:translate(var(--x),var(--y)) scale(1.2);opacity:1}}
  .ending-title{display:block;font-size:1.2rem;color:var(--moon);margin:0 0 8px}.score-line,.mission-box,.record-line{padding:12px 15px;border:1px solid var(--border);border-radius:12px;background:#191b34;margin:14px 0;color:var(--ink-dim);font-size:.92rem;line-height:1.7}
  .mission-box strong{color:var(--moon)} .ending-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  button.secondary{background:#262848;color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit;cursor:pointer} button.secondary:hover{border-color:var(--moon)}
  .wish-result{color:var(--moon);font-style:italic}.celebrate{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}.celebrate i{position:absolute;bottom:0;font-style:normal;font-size:22px;animation:floatWish 3s ease-out forwards}@keyframes floatWish{to{transform:translateY(-100vh) rotate(25deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){.ending-scene .spark{animation:none;opacity:1;transform:translate(var(--x),var(--y))}}
  @media (max-width:640px){ .card{ padding:32px 24px; } h1{ font-size:1.5rem; } .story-text{ font-size:1.02rem; line-height:1.85; } }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } .stars{ animation:none; } .decor svg{ animation:none; } .floating-lantern,.firefly,.osmanthus{animation:none;display:none} }
</style>
</head>
<body>
  <div class="sky"></div><div class="stars"></div><div class="moon"></div>
  <div class="ambient-effects" aria-hidden="true">
    <span class="floating-lantern">🏮</span><span class="floating-lantern">🏮</span><span class="floating-lantern">🏮</span><span class="floating-lantern">🏮</span>
    <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
    <span class="osmanthus">✿</span><span class="osmanthus">✿</span><span class="osmanthus">✿</span>
  </div>

  <div class="decor left">
    <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--lantern)" stroke-width="2">
      <line x1="30" y1="2" x2="30" y2="12"/><rect x="16" y="12" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/>
      <path d="M16 18 C10 30 10 55 16 66 L44 66 C50 55 50 30 44 18 Z"/>
      <line x1="20" y1="22" x2="20" y2="62"/><line x1="30" y1="22" x2="30" y2="62"/><line x1="40" y1="22" x2="40" y2="62"/>
      <rect x="16" y="66" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/><line x1="30" y1="72" x2="30" y2="84"/>
    </svg>
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--moon)" stroke-width="2">
      <path d="M6 54 C20 40 20 20 30 6" stroke-linecap="round"/>
      <circle cx="14" cy="42" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="20" cy="30" r="3.2" fill="var(--moon)" stroke="none"/>
      <circle cx="26" cy="18" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="30" cy="6" r="3.2" fill="var(--moon)" stroke="none"/>
    </svg>
    <svg viewBox="0 0 70 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--ink-dim)" stroke-width="2">
      <ellipse cx="34" cy="40" rx="22" ry="15"/><circle cx="20" cy="22" r="10"/>
      <path d="M14 16 C10 4 16 2 18 12" stroke-linecap="round"/><path d="M24 16 C24 2 30 2 28 12" stroke-linecap="round"/>
      <circle cx="16" cy="22" r="1.6" fill="var(--ink-dim)" stroke="none"/>
    </svg>

  <div class="decor right">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--moon)" stroke-width="2">
      <rect x="6" y="6" width="48" height="48" rx="8"/><circle cx="30" cy="30" r="12"/>
      <path d="M30 6 V54 M6 30 H54" stroke-width="1" opacity=".5"/>
    </svg>
    <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--lantern)" stroke-width="2">
      <line x1="30" y1="2" x2="30" y2="12"/><rect x="16" y="12" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/>
      <path d="M16 18 C10 30 10 55 16 66 L44 66 C50 55 50 30 44 18 Z"/>
      <line x1="20" y1="22" x2="20" y2="62"/><line x1="30" y1="22" x2="30" y2="62"/><line x1="40" y1="22" x2="40" y2="62"/>
      <rect x="16" y="66" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/><line x1="30" y1="72" x2="30" y2="84"/>
    </svg>
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--moon)" stroke-width="2">
      <path d="M54 54 C40 40 40 20 30 6" stroke-linecap="round"/>
      <circle cx="46" cy="42" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="40" cy="30" r="3.2" fill="var(--moon)" stroke="none"/>
      <circle cx="34" cy="18" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="30" cy="6" r="3.2" fill="var(--moon)" stroke="none"/>

  </div>

  <main><div class="card" id="card"></div></main>

<script>
/* 部署 Cloudflare Worker 後,把下面換成你自己的網址,例如:
   "https://moon-festival-stats.你的子網域.workers.dev" */
const CONFIG = {
  WORKER_URL: "https://moon-festival-stats.YOUR-SUBDOMAIN.workers.dev"
};

/* ---------- 故事資料 ----------
   text / desc 可以是字串,也可以是 ctx => 字串,依本輪的選擇(ctx.has)或過去解鎖的結局(ctx.seen)改變內容。
   choice.set:選了之後記住一件事;choice.when:條件成立才出現這個選項。 */
const story = {
  start: {
    text: ctx => (ctx.seenAny ? "又是一年中秋。" : "") + "中秋夜,天色一點一點沉下來。月亮從對面屋簷後探出半張臉,巷子裡飄來炭火的煙味,鄰居的燈籠一盞一盞亮起。\n\n你站在自家門口,手裡拎著一盒月餅。今晚,你得決定要怎麼過。",
    choices: [
      { label: "回家和家人一起烤肉、拜月娘", next: "bbq" },
      { label: "一個人到河堤走走,靜靜賞月", next: "walk" }
    ]
  },

  /* ---------- 烤肉線 ---------- */
  bbq: {
    text: "推開院子的鐵門,炭香撲面而來。爸媽和弟妹圍著烤肉架坐好,奶奶正把月餅、柚子擺上供桌準備拜月娘。弟弟把烤肉夾塞進你手裡:「快點,肉要焦了!」",
    choices: [
      { label: "接過夾子,認真幫忙翻烤肉", next: "bbq_help" },
      { label: "趁大家不注意,偷咬一口月餅", next: "bbq_sneak" }
    ]
  },
  bbq_help: {
    text: "你蹲在爐邊仔細翻著肉,油脂滴在炭火上滋滋作響。第一片烤得恰到好處,弟妹眼巴巴地盯著你的夾子。",
    choices: [
      { label: "把第一片夾給弟妹", next: "bbq_together", set: "shared_meat" },
      { label: "先夾給一直在忙供桌的奶奶", next: "bbq_together", set: "grandma_first" }
    ]
  },
  bbq_sneak: {
    text: "你偷偷咬了一口——豆沙甜得剛好。奶奶忽然轉頭看你,你整個人僵住。",
    choices: [
      { label: "老實承認,掰一半分給奶奶", next: "bbq_grandma_mooncake", set: "honest" },
      { label: "假裝在研究月餅上的花紋", next: "bbq_grandma_mooncake" }
    ]
  },
  bbq_grandma_mooncake: {
    text: ctx => (ctx.has("honest")
      ? "奶奶接過那半塊月餅,笑出聲來:「肯分人的,才是真的會吃。」"
      : "奶奶沒有拆穿你,只是笑了笑:「偷吃的那口最甜,我以前也這樣。」")
      + "她從口袋摸出一顆用油紙包著的自製月餅,塞進你手裡:「這顆留著,等等再吃。」",
    choices: [
      { label: "把月餅收進口袋,坐回桌邊", next: "bbq_together", set: "grandma_mooncake" },
      { label: "忍不住當場拆開吃掉", next: "bbq_together" }
    ]
  },
  bbq_together: {
    text: ctx => (ctx.has("shared_meat") ? "弟妹吃得滿嘴油,吵著下一片還要你烤。\n\n" : "")
      + (ctx.has("grandma_first") ? "奶奶嚼著你夾的肉,嘴上說太鹹,卻又自己多夾了一片。\n\n" : "")
      + "肉烤好了,全家人終於坐下。奶奶把收音機音量調大,一首老歌流洩出來,她跟著哼了兩句,眼神飄向遠方。這時,門口好像有人在探頭探腦。",
    choices: [
      { label: "問奶奶以前的中秋是什麼樣子", next: "bbq_grandma_story" },
      { label: "提議大家一起做燈籠", next: "bbq_make_lantern" },
      { label: "去門口看看是誰", next: "bbq_neighbor" }
    ]
  },
  bbq_grandma_story: {
    text: ctx => "奶奶說起小時候家裡窮,一家七口分吃一顆月餅,那種擠在一起的感覺,比什麼山珍海味都珍貴。"
      + (ctx.seenDoor ? "\n\n說到一半,奶奶壓低聲音:「我七歲那年,還在河堤邊看過一道發亮的門……你阿公說我是在作夢。」她看著你,好像在等你說什麼。" : ""),
    choices: [
      { label: "靜靜聽完", next: "bbq_moon_rise" },
      { label: "握住奶奶的手", next: "bbq_moon_rise", set: "held_hand" },
      { label: "小聲告訴奶奶:「我也看過那道門。」", next: "bbq_secret", when: ctx => ctx.seenDoor }
    ]
  },
  bbq_secret: {
    text: "奶奶愣了好一會兒,然後笑到眼淚都流出來。她握緊你的手,像個小女孩一樣問:「那她……還在搗藥嗎?」\n\n你點點頭。奶奶望著月亮,輕輕說:「那就好。」",

/* ---------- 引擎 ---------- */
const card = document.getElementById('card');
const PLAYERS_KEY = 'moon-festival-players';
const MISSIONS = [
  { text: '走進月光門，看看傳說的另一端', test: run => run.visited.includes('chang_e') },
  { text: '選擇一個溫柔的夜晚結局', test: run => ['peace','reunion_quiet','homeward','homeward2','late_reunion'].includes(run.ending) },
  { text: '在故事中做出至少 6 次選擇', test: run => run.steps >= 6 },
  { text: '找到一個平常不會走的分支', test: run => ['rabbit','bbq_make_lantern','bbq_neighbor'].some(k => run.visited.includes(k)) },
  { text: '讓奶奶給的月餅派上用場', test: run => run.flags.has('split_mooncake') },
  { text: '在停電的夜裡找到光', test: run => run.visited.includes('bbq_blackout') }
];
const DOOR_ENDINGS = ['legend', 'homeward', 'homeward2'];
const ENDING_ROUTES = {
  gratitude:'烤肉線', reunion_quiet:'烤肉線', candlelight:'烤肉線', rooftop_promise:'烤肉線', extra_bowl:'烤肉線',
  legend:'賞月線', homeward2:'賞月線', homeward:'賞月線', hope:'賞月線', peace:'賞月線', late_reunion:'賞月線',
  hidden:'集滿所有結局後開啟'
};
let mission, stepCount, visited, storyLog, transcript, flags, wishText, currentRunSaved;
let playerName = '';

function resetRun(){
  stepCount = 0; visited = []; storyLog = []; transcript = []; flags = new Set(); wishText = ''; currentRunSaved = false;
  mission = MISSIONS[Math.floor(Math.random() * MISSIONS.length)];
}
resetRun();

// 故事內容讀取狀態用:本輪的選擇 + 過去解鎖過的結局
function ctx(){
  const seen = getUnlocked();
  return {
    has: flag => flags.has(flag),
    seen: id => seen.includes(id),
    seenAny: seen.length > 0,
    seenDoor: DOOR_ENDINGS.some(id => seen.includes(id)),
    wish: wishText
  };
}
function resolve(value){ return typeof value === 'function' ? value(ctx()) : value; }

// 前情回顧:每一段讀過的劇情和當時的選擇,收在可展開的資料夾裡
function remember(text, choice){ transcript.push({ text, choice }); storyLog.push(choice); }
function recapHtml(){
  if (!transcript.length) return '';
  return `<details class="fold recap"><summary>前情回顧 · 已走過 ${transcript.length} 段</summary><div class="fold-body">${
    transcript.map(item => `<div class="recap-item">${item.text}<span class="picked">➤ 你選擇:${escapeHtml(item.choice)}</span></div>`).join('')
  }</div></details>`;
}

// 故事紀錄的路徑只保留文字;舊版留下的物件或 "[object Object]" 一律丟掉
function cleanPath(path){
  return (Array.isArray(path) ? path : [])
    .map(step => typeof step === 'string' ? step : (step && typeof step === 'object' ? (step.choice || step.label || '') : ''))
    .filter(step => typeof step === 'string' && step && step !== '[object Object]');
}
try {
  const log = JSON.parse(localStorage.getItem('moon-festival-story-log') || '[]');
  localStorage.setItem('moon-festival-story-log', JSON.stringify(log.map(item => ({ ...item, path: cleanPath(item.path) }))));
} catch(e){ /* localStorage 不可用時安靜略過 */ }

// 每位玩家各自的解鎖結局與遊玩次數:{ 玩家名稱: { unlocked:[], plays, wishLights } }
const emptyPlayer = () => ({ unlocked: [], plays: 0, wishLights: 0 });
function loadPlayers(){
  try {
    const raw = localStorage.getItem(PLAYERS_KEY);
    if (raw) return JSON.parse(raw);
    // 第一次使用:從既有的故事紀錄整理出每位玩家玩過的結局
    const players = {};
    JSON.parse(localStorage.getItem('moon-festival-story-log') || '[]').forEach(item => {
      const name = String(item.player || '月光旅人');
      const p = players[name] || (players[name] = emptyPlayer());
      p.plays += 1;
      if (endings[item.ending] && !p.unlocked.includes(item.ending)) p.unlocked.push(item.ending);
    });
    localStorage.setItem(PLAYERS_KEY, JSON.stringify(players));
    return players;
  } catch(e){ return {}; }
}
function getRecords(){ return { ...emptyPlayer(), ...loadPlayers()[playerName] }; }
function updateRecords(change){
  try {
    const players = loadPlayers();
    const p = { ...emptyPlayer(), ...players[playerName] };
    change(p);
    players[playerName] = p;
    localStorage.setItem(PLAYERS_KEY, JSON.stringify(players));
  } catch(e){ /* localStorage 不可用時安靜略過 */ }
}
function getUnlocked(){ return getRecords().unlocked; }
function unlockEnding(id){ updateRecords(p => { if (!p.unlocked.includes(id)) p.unlocked.push(id); }); }
function saveEnding(){ updateRecords(p => { p.plays += 1; }); }
function escapeHtml(value){return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function lightLantern(){
  updateRecords(p => { p.wishLights += 1; });
  const layer=document.createElement('div');layer.className='celebrate';layer.setAttribute('aria-hidden','true');
  ['🏮','✨','🌕','🎐','⭐'].forEach((symbol,i)=>{const item=document.createElement('i');item.textContent=symbol;item.style.left=(12+i*18)+'%';item.style.animationDelay=(i*.13)+'s';layer.appendChild(item)});
  document.body.appendChild(layer);setTimeout(()=>layer.remove(),3400);
  const button=document.getElementById('lanternBtn');if(button){button.textContent='願望已乘著燈火升起';button.disabled=true;button.setAttribute('aria-pressed','true');}
}

function incrementEndingRemote(id){
  // 統計功能是加分項,不是核心體驗:失敗或沒設定 WORKER_URL 時安靜略過,不影響故事本身。
  if (!CONFIG.WORKER_URL || CONFIG.WORKER_URL.includes("YOUR-SUBDOMAIN")) return;
  fetch(CONFIG.WORKER_URL + "/increment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ending: id })
  }).catch(() => { /* 離線或伺服器暫時不可用,不影響使用者體驗 */ });
}

async function fetchStats(){
  if (!CONFIG.WORKER_URL || CONFIG.WORKER_URL.includes("YOUR-SUBDOMAIN")) return null;
  try {
    const res = await fetch(CONFIG.WORKER_URL + "/stats");
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

async function saveStoryRecord(record){
  try { const list=JSON.parse(localStorage.getItem('moon-festival-story-log')||'[]'); list.unshift(record); localStorage.setItem('moon-festival-story-log',JSON.stringify(list.slice(0,50))); } catch(e){}
  if(!CONFIG.WORKER_URL||CONFIG.WORKER_URL.includes('YOUR-SUBDOMAIN')) return;
  try { await fetch(CONFIG.WORKER_URL+'/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)}); } catch(e){}
}
async function fetchStoryRecords(){
  if(!CONFIG.WORKER_URL||CONFIG.WORKER_URL.includes('YOUR-SUBDOMAIN')) return null;
  try { const res=await fetch(CONFIG.WORKER_URL+'/stories'); if(!res.ok)return null; return await res.json(); } catch(e){return null;}
}
function renderPlayerEntry(){
  card.innerHTML=`<h1>月圓之夜</h1><p class="subtitle">先留下你的名稱，再開始今晚的故事。</p><label for="playerNameInput">玩家名稱</label><input class="wish-input" id="playerNameInput" maxlength="24" autocomplete="nickname" placeholder="輸入你想使用的名稱"><div class="choices"><button class="choice" id="enterStoryBtn">進入故事</button></div><div class="nav-links" style="margin-top:18px;"><button class="stats-link" id="entryStoriesBtn">查看其他玩家</button></div>`;
  const input=document.getElementById('playerNameInput');
  document.getElementById('enterStoryBtn').addEventListener('click',()=>{playerName=input.value.trim().slice(0,24)||'月光旅人';resetRun();render('start');});
  input.addEventListener('keydown',event=>{if(event.key==='Enter')document.getElementById('enterStoryBtn').click();});
  document.getElementById('entryStoriesBtn').addEventListener('click',()=>renderStats(null));}

// 回到開頭畫面(從統計或收藏頁返回時用,不重抽任務)
function backToStart(){
  if (!playerName) { renderPlayerEntry(); return; }
  stepCount = 0; visited = []; render('start');
}

function renderCollection(returnToEnding){
  const unlocked = getUnlocked();
  const records = getRecords();
  const ids = Object.keys(endings);
  const regular = ids.filter(id => id !== 'hidden');
  card.innerHTML = `
    <h1 style="font-size:1.3rem;margin-bottom:4px;">${escapeHtml(playerName)} 的結局收藏</h1>
    <p class="unlock-line" style="margin-bottom:6px;">已解鎖 ${regular.filter(id => unlocked.includes(id)).length} / ${regular.length} 個一般結局${unlocked.includes('hidden') ? ' · 隱藏結局已解鎖' : ''}</p>
    <p class="subtitle">共遊玩 ${records.plays} 次</p>
    <div class="collection">${ids.map(id => unlocked.includes(id)
      ? `<div class="ending-card"><strong>${endings[id].title.replace('隱藏結局:','').replace('結局:','')}</strong>${endings[id].rating.replace('稱號｜','')}<br><small>${ENDING_ROUTES[id]}</small></div>`
      : `<div class="ending-card locked"><strong>？？？</strong>尚未解鎖<br><small>${ENDING_ROUTES[id]}</small></div>`
    ).join('')}</div>
    <button class="restart" id="backBtn">返回</button>
  `;
  document.getElementById('backBtn').addEventListener('click', () => returnToEnding ? renderEnding(returnToEnding) : backToStart());
}

function renderEnding(id){
  const ending = endings[id];
  const desc = resolve(ending.desc);
  const firstRender=!currentRunSaved;
  if(firstRender){unlockEnding(id);incrementEndingRemote(id);saveEnding(id);currentRunSaved=true;}
  const records=getRecords();
  if(firstRender)saveStoryRecord({player:playerName||'月光旅人',ending:id,endingTitle:ending.title,description:desc,path:storyLog.slice(),date:new Date().toISOString()});
  const missionDone=mission.test({visited,flags,ending:id,steps:stepCount});
  const allEndings=[...new Set([...getUnlocked(),id])];
  const regularEndingCount=Object.keys(endings).length-1;
  const secretUnlocked=Object.keys(endings).filter(key=>key!=='hidden').every(key=>allEndings.includes(key));
  card.innerHTML = `
    <div class="ending-scene" aria-hidden="true"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></div>
    <span class="ending-tag">${ending.title}</span>
    <strong class="ending-title">${ending.rating}</strong>
    <p style="color:var(--ink-dim);font-size:1.02rem;margin-bottom:6px;">${desc}</p>
    <div class="record-line">玩家：${escapeHtml(playerName||'月光旅人')}</div>
    ${recapHtml()}
    <div class="score-line">${missionDone ? '任務完成！' : '再玩一次挑戰任務'}<br>${missionDone ? '🌟 ' + mission.text : '🎯 ' + mission.text}</div>
    ${id==='hidden' ? '<p class="wish-result">你走過了每一段中秋夜，整片夜空都為你亮起。</p>' : ''}
    <div class="record-line">${escapeHtml(playerName)} 已遊玩 ${records.plays} 次 · 已解鎖 ${allEndings.filter(key=>key!=='hidden').length} / ${regularEndingCount} 個一般結局${allEndings.includes('hidden') ? ' · 隱藏結局已解鎖' : ''}${secretUnlocked && !allEndings.includes('hidden') ? '<br>月色深處似乎還藏著一段故事……' : ''}</div>
    ${secretUnlocked && !allEndings.includes('hidden') ? '<button class="secondary" id="secretBtn" style="width:100%;margin:0 0 12px;">追尋月色深處的故事</button>' : ''}
    <div class="ending-actions"><button class="secondary" id="lanternBtn" aria-pressed="false">點亮一盞願望燈</button><button class="secondary" id="shareBtn">分享本次結局</button></div>
    <button class="restart" id="restartBtn">重新開始這個中秋夜</button>
    <div class="nav-links" style="margin-top:14px;"><button class="stats-link" id="viewStatsBtn">查看其他玩家</button><button class="stats-link" id="viewCollectionBtn">我的結局收藏</button></div>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => { resetRun(); render('start'); });
  document.getElementById('lanternBtn').addEventListener('click',lightLantern);
  const secretBtn=document.getElementById('secretBtn');if(secretBtn)secretBtn.addEventListener('click',()=>{ resetRun(); render('hidden_1'); });
  document.getElementById('shareBtn').addEventListener('click',async()=>{
    const text=`我在《月圓之夜》走到了「${ending.title.replace('隱藏結局:','').replace('結局:','')}」。`;
    try{await navigator.clipboard.writeText(text);document.getElementById('shareBtn').textContent='已複製到剪貼簿';}catch(e){document.getElementById('shareBtn').textContent=text;}
  });
  document.getElementById('viewStatsBtn').addEventListener('click', () => renderStats(id));
  document.getElementById('viewCollectionBtn').addEventListener('click', () => renderCollection(id));
}

async function renderStats(returnToEnding){
  card.innerHTML = `<p class="story-text">讀取統計中…</p>`;
  const data = await fetchStats();

  if (!data) {
    card.innerHTML = `
      <h1 style="font-size:1.3rem;">結局統計</h1>
      <p class="story-text" style="font-size:1rem;color:var(--ink-dim);">目前無法連線到統計伺服器,可能是還沒設定,或暫時離線,稍後再試看看。</p>
      <button class="restart" id="backBtn">返回</button>
    `;
  } else {
    const total = Object.values(data).reduce((a, b) => a + b, 0) || 1;
    const rows = Object.entries(data)
      .sort((a, b) => b[1] - a[1])
      .map(([id, count]) => {
        const pct = Math.round((count / total) * 100);
        const title = endings[id] ? endings[id].title.replace('結局:', '') : id;
        return `
          <div class="stat-row">
            <div class="stat-label"><span>${title}</span><span>${count} 次</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;"></div></div>
          </div>`;
      }).join('');

    card.innerHTML = `
      <h1 style="font-size:1.3rem;margin-bottom:4px;">結局統計</h1>
      <p class="unlock-line" style="margin-bottom:24px;">全部玩家累積抵達結局共 ${total} 次</p>
      ${rows}
      <button class="restart" id="backBtn" style="margin-top:22px;">返回</button>
    `;
  }

  let storyRecords=await fetchStoryRecords();
  if(!storyRecords){try{storyRecords=JSON.parse(localStorage.getItem('moon-festival-story-log')||'[]');}catch(e){storyRecords=[];}}
  const storySection=document.createElement('section');
  // 一位玩家一個資料夾,點開才看得到他每一次的遊玩紀錄
  const players = new Map();
  storyRecords.forEach(item => {
    const name = String(item.player || '月光旅人');
    if (!players.has(name)) players.set(name, []);
    players.get(name).push(item);
  });
  const playRow = item => {
    const path = cleanPath(item.path);
    const title = String(item.endingTitle || item.ending || '中秋夜').replace('隱藏結局:','').replace('結局:','');
    return `<div class="recap-item"><strong style="color:var(--moon);">${escapeHtml(title)}</strong> <small>${escapeHtml(item.date?new Date(item.date).toLocaleString():'')}</small><br>${path.length ? path.map(escapeHtml).join(' → ') : escapeHtml(typeof item.description === 'string' ? item.description : '')}</div>`;
  };
  const playerFolder = ([name, plays]) => {
    const endingCount = new Set(plays.map(item => item.ending)).size;
    return `<details class="fold"><summary><strong style="color:var(--ink);">${escapeHtml(name)}</strong> · 玩了 ${plays.length} 次 · 走到 ${endingCount} 種結局</summary><div class="fold-body">${plays.map(playRow).join('')}</div></details>`;
  };
  storySection.innerHTML=`<h2 style="font-size:1.15rem;color:var(--moon);margin-top:26px;">玩家故事紀錄</h2>${[...players].map(playerFolder).join('')||'<p class="stats-note">還沒有玩家留下故事紀錄。</p>'}`;
  card.insertBefore(storySection,document.getElementById('backBtn'));

  document.getElementById('backBtn').addEventListener('click', () => returnToEnding ? renderEnding(returnToEnding) : backToStart());
}

function renderWish(){
  stepCount += 1;
  const wishPrompt = "月光靜靜灑下來。閉上眼睛,把心裡那句話寫下來——";
  card.innerHTML = `
    <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
    ${recapHtml()}
    <h1>許願</h1>
    <p class="story-text">${wishPrompt}</p>
    <input class="wish-input" id="wishInput" maxlength="60" placeholder="輸入你想許的願望...">
    <div class="choices"><button class="choice" id="wishSubmit">許下這個願望</button></div>
  `;
  document.getElementById('wishSubmit').addEventListener('click', () => {
    const rawWish = document.getElementById('wishInput').value.trim() || "一個沒有說出口、只有自己知道的願望";
    wishText = escapeHtml(rawWish);
    remember(wishPrompt, '許下願望：'+rawWish);
    stepCount += 1;
    const wishEcho = `你在心裡把「${wishText}」一字一句慢慢說了一遍。一陣風忽然吹過堤岸的芒草,沙沙作響,你分不清是巧合,還是月亮真的聽見了。`;
    card.innerHTML = `
      <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
      ${recapHtml()}
      <div class="story-text">${wishEcho}</div>
      <div class="choices">
        <button class="choice" id="wishContinue">起身,往回家的路走去</button>
        <button class="choice" id="wishWait">再坐一會兒,等月亮回答</button>
      </div>
    `;
    document.getElementById('wishContinue').addEventListener('click', () => { remember(wishEcho, '起身,往回家的路走去'); renderEnding('hope'); });
    document.getElementById('wishWait').addEventListener('click', () => { flags.add('waited'); remember(wishEcho, '再坐一會兒,等月亮回答'); renderEnding('hope'); });
  });
}

function render(nodeKey){
  if (nodeKey.startsWith('END:')) { renderEnding(nodeKey.slice(4)); return; }
  visited.push(nodeKey);
  const node = story[nodeKey];
  if (node.isWishInput) { renderWish(); return; }

  stepCount += 1;
  const c = ctx();
  const choices = node.choices.filter(choice => !choice.when || choice.when(c));
  const text = resolve(node.text);
  card.innerHTML = `
    <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
    ${nodeKey === 'start' ? renderStartHeader() : ''}
    ${recapHtml()}
    <div class="story-text">${text}</div>
    <div class="choices">
      ${choices.map((choice, i) => `<button class="choice" data-index="${i}">${choice.label}</button>`).join('')}
    </div>
  `;
  card.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const choice = choices[btn.dataset.index];
      if (choice.set) flags.add(choice.set);
      remember(text, choice.label);
      render(choice.next);
    });
  });

  if (nodeKey === 'start') {
    document.getElementById('startStatsBtn').addEventListener('click', () => renderStats(null));
    document.getElementById('startCollectionBtn').addEventListener('click', () => renderCollection(null));
  }
}

function renderStartHeader(){
  const unlocked = getUnlocked().length;
  const total = Object.keys(endings).length;
  return `<h1>月圓之夜</h1>
    <p class="subtitle">一個中秋夜的分支故事 · 你的選擇決定結局</p>
    <p class="unlock-line">已解鎖 ${unlocked} / ${total} 個結局</p>
    <div class="mission-box"><strong>本輪月光任務</strong><br>${mission.text}</div>
    <div class="nav-links"><button class="stats-link" id="startStatsBtn">查看其他玩家</button><button class="stats-link" id="startCollectionBtn">我的結局收藏</button></div>`;
}

renderPlayerEntry();
</script>
