<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月圓之夜 · 互動故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161829; --bg2:#1f2140; --card:#20223d;
    --moon:#e8c872; --lantern:#c8553d; --ink:#f2e9d8; --ink-dim:#b9b3c9; --border:#3a3d63;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; background:var(--bg); font-family:'Noto Serif TC', serif; color:var(--ink); }
  body{ position:relative; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:48px 20px; overflow-x:hidden; }
  .sky{ position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 82% 12%, rgba(232,200,114,0.32), rgba(232,200,114,0) 45%),
      radial-gradient(ellipse at 50% 100%, var(--bg2), var(--bg) 70%); }
  .moon{ position:fixed; top:7%; right:9%; width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6da, var(--moon) 60%, #c9a24f 100%);
    box-shadow:0 0 70px 12px rgba(232,200,114,0.35); z-index:0; }
  .stars{ position:fixed; inset:0; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 12%, #fff, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 85% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 92% 25%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, #fff, transparent);
    opacity:0.6; animation:twinkle 5s ease-in-out infinite alternate; }
  .ambient-effects{position:fixed;inset:0;z-index:.5;overflow:hidden;pointer-events:none;}
  .floating-lantern{position:absolute;bottom:-100px;font-size:34px;opacity:0;filter:drop-shadow(0 0 12px rgba(232,200,114,.55));animation:lantern-rise 24s linear infinite;}
  .floating-lantern:nth-child(1){left:5%;animation-delay:-3s;animation-duration:27s;font-size:30px}
  .floating-lantern:nth-child(2){right:6%;animation-delay:-15s;animation-duration:30s;font-size:38px}
  .floating-lantern:nth-child(3){left:15%;animation-delay:-20s;animation-duration:34s;font-size:24px}
  .floating-lantern:nth-child(4){right:16%;animation-delay:-8s;animation-duration:32s;font-size:27px}
  @keyframes lantern-rise{0%{transform:translate3d(0,0,0) rotate(-5deg);opacity:0}8%{opacity:.58}45%{transform:translate3d(18px,-55vh,0) rotate(5deg)}90%{opacity:.5}100%{transform:translate3d(-12px,-120vh,0) rotate(-4deg);opacity:0}}
  .firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffeaa3;box-shadow:0 0 12px 3px rgba(255,226,133,.72);opacity:0;animation:firefly-drift 7s ease-in-out infinite}
  .firefly:nth-of-type(5){left:11%;top:68%;animation-delay:-2s}.firefly:nth-of-type(6){right:13%;top:36%;animation-delay:-5s}.firefly:nth-of-type(7){left:20%;top:25%;animation-delay:-3s}.firefly:nth-of-type(8){right:21%;top:76%;animation-delay:-1s}
  @keyframes firefly-drift{0%,100%{transform:translate(0,10px);opacity:0}40%,60%{transform:translate(14px,-22px);opacity:.85}}
  .osmanthus{position:absolute;bottom:-24px;color:#e8c872;font-size:15px;opacity:0;animation:petal-drift 19s linear infinite}
  .osmanthus:nth-last-child(3){left:28%;animation-delay:-9s}.osmanthus:nth-last-child(2){left:70%;animation-delay:-15s}.osmanthus:nth-last-child(1){left:46%;animation-delay:-4s}
  @keyframes petal-drift{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:.48}100%{transform:translate3d(42px,-110vh,0) rotate(180deg);opacity:0}}
  @keyframes twinkle{ from{opacity:.35;} to{opacity:.75;} }
  .decor{ position:fixed; top:0; bottom:0; width:180px; z-index:0; pointer-events:none; }
  .decor.left{ left:0; } .decor.right{ right:0; }
  .decor svg{ position:absolute; opacity:.55; animation:float 7s ease-in-out infinite; }
  .decor.left svg:nth-child(1){ top:8%;  left:18px; width:64px; animation-delay:0s; }
  .decor.left svg:nth-child(2){ top:42%; left:46px; width:52px; animation-delay:1.5s; }
  .decor.left svg:nth-child(3){ top:76%; left:10px; width:58px; animation-delay:3s; }
  .decor.right svg:nth-child(1){ top:14%; right:20px; width:58px; animation-delay:.8s; }
  .decor.right svg:nth-child(2){ top:48%; right:44px; width:66px; animation-delay:2.2s; }
  .decor.right svg:nth-child(3){ top:80%; right:14px; width:50px; animation-delay:3.6s; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @media (max-width: 1180px){ .decor{ display:none; } }

  main{ position:relative; z-index:1; width:100%; max-width:760px; }
  .card{ background:linear-gradient(180deg, var(--card), #191b34); border:1px solid var(--border); border-radius:20px;
    padding:52px 56px; box-shadow:0 24px 70px rgba(0,0,0,0.45); animation:fadein .5s ease both; }
  @keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  h1{ margin:0 0 8px; font-size:1.9rem; font-weight:700; letter-spacing:.04em; color:var(--moon); }
  .subtitle{ margin:0 0 8px; font-size:.92rem; color:var(--ink-dim); }
  .unlock-line{ margin:0 0 26px; font-size:.85rem; color:var(--lantern); }
  .story-text{ font-size:1.14rem; line-height:1.95; white-space:pre-line; margin-bottom:30px; }
  .choices{ display:flex; flex-direction:column; gap:14px; }
  button.choice{ text-align:left; background:#262848; color:var(--ink); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; font-family:inherit; font-size:1.04rem; line-height:1.6; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .15s ease; }
  button.choice:hover{ border-color:var(--moon); background:#2c2f58; transform:translateX(3px); }
  button.choice:focus-visible{ outline:2px solid var(--moon); outline-offset:2px; }
  .ending-tag{ display:inline-block; font-size:.8rem; color:var(--lantern); border:1px solid var(--lantern);
    border-radius:999px; padding:4px 14px; margin-bottom:18px; letter-spacing:.06em; }
  .memories{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 26px; }
  .memories span{ font-size:.82rem; color:var(--moon); border:1px solid var(--moon); border-radius:999px; padding:4px 12px; opacity:.9; }
  button.restart{ margin-top:4px; width:100%; background:var(--lantern); color:#fff6ea; border:none; border-radius:12px;
    padding:15px 18px; font-family:inherit; font-size:1.05rem; cursor:pointer; transition:filter .15s ease; }
  button.restart:hover{ filter:brightness(1.1); }
  .step-label{ font-size:.8rem; color:var(--ink-dim); margin-bottom:16px; letter-spacing:.05em; }
  .stats-link{ background:none; border:none; color:var(--ink-dim); text-decoration:underline; cursor:pointer;
    font-family:inherit; font-size:.85rem; padding:0; margin-bottom:26px; }
  .stats-link:hover{ color:var(--moon); }
  .stat-row{ margin-bottom:14px; }
  .stat-row .stat-label{ display:flex; justify-content:space-between; font-size:.92rem; margin-bottom:5px; }
  .stat-row .stat-bar-bg{ background:var(--border); border-radius:6px; height:10px; overflow:hidden; }
  .stat-row .stat-bar-fill{ background:var(--moon); height:100%; border-radius:6px; transition:width .5s ease; }
  .stats-note{ color:var(--ink-dim); font-size:.85rem; margin-top:22px; }
  .wish-input{ width:100%; background:#161829; color:var(--ink); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; font-family:inherit; font-size:1.02rem; margin-bottom:14px; }
  .wish-input:focus-visible{ outline:2px solid var(--moon); }
  .ending-scene{ position:relative; height:150px; margin:-18px 0 14px; overflow:hidden; }
  .ending-scene .spark{ position:absolute; left:50%; top:74%; width:7px; height:7px; border-radius:50%; background:var(--moon); box-shadow:0 0 14px var(--moon); animation:rise 1.5s ease-out both; }
  .ending-scene .spark:nth-child(1){--x:-90px;--y:-65px;animation-delay:.05s}.ending-scene .spark:nth-child(2){--x:-60px;--y:-110px;animation-delay:.12s}.ending-scene .spark:nth-child(3){--x:-30px;--y:-78px;animation-delay:.2s}.ending-scene .spark:nth-child(4){--x:0px;--y:-125px;animation-delay:.28s}.ending-scene .spark:nth-child(5){--x:30px;--y:-80px;animation-delay:.36s}.ending-scene .spark:nth-child(6){--x:60px;--y:-108px;animation-delay:.44s}.ending-scene .spark:nth-child(7){--x:90px;--y:-65px;animation-delay:.52s}
  @keyframes rise{from{transform:translate(0,0) scale(.2);opacity:0}to{transform:translate(var(--x),var(--y)) scale(1.2);opacity:1}}
  .ending-title{display:block;font-size:1.2rem;color:var(--moon);margin:0 0 8px}.score-line,.mission-box,.record-line{padding:12px 15px;border:1px solid var(--border);border-radius:12px;background:#191b34;margin:14px 0;color:var(--ink-dim);font-size:.92rem;line-height:1.7}
  .mission-box strong{color:var(--moon)} .ending-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  button.secondary{background:#262848;color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit;cursor:pointer} button.secondary:hover{border-color:var(--moon)}
  .wish-result{color:var(--moon);font-style:italic}.celebrate{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}.celebrate i{position:absolute;bottom:0;font-style:normal;font-size:22px;animation:floatWish 3s ease-out forwards}@keyframes floatWish{to{transform:translateY(-100vh) rotate(25deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){.ending-scene .spark{animation:none;opacity:1;transform:translate(var(--x),var(--y))}}
  @media (max-width:640px){ .card{ padding:32px 24px; } h1{ font-size:1.5rem; } .story-text{ font-size:1.02rem; line-height:1.85; } }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } .stars{ animation:none; } .decor svg{ animation:none; } .floating-lantern,.firefly,.osmanthus{animation:none;display:none} }
</style>
</head>
<body>
  <div class="sky"></div><div class="stars"></div><div class="moon"></div>
  <div class="ambient-effects" aria-hidden="true">

      <path d="M16 18 C10 30 10 55 16 66 L44 66 C50 55 50 30 44 18 Z"/>
      <line x1="20" y1="22" x2="20" y2="62"/><line x1="30" y1="22" x2="30" y2="62"/><line x1="40" y1="22" x2="40" y2="62"/>
      <rect x="16" y="66" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/><line x1="30" y1="72" x2="30" y2="84"/>

  <main><div class="card" id="card"></div></main>

<script>
/* 部署 Cloudflare Worker 後,把下面換成你自己的網址,例如:
   "https://moon-festival-stats.你的子網域.workers.dev" */
const CONFIG = {
  WORKER_URL: "https://moon-festival-stats.YOUR-SUBDOMAIN.workers.dev"
};

const story = {
  start: {
    text: "中秋夜,天色一點一點沉下來。月亮從對面屋簷後探出半張臉,巷子裡飄來炭火的煙味,鄰居的燈籠一盞一盞亮起。\n\n你站在自家門口,手裡拎著一盒月餅。今晚,你得決定要怎麼過。",
    choices: [
      { label: "回家和家人一起烤肉、拜月娘", next: "bbq" },
      { label: "一個人到河堤走走,靜靜賞月", next: "walk" }
    ]
  },

  /* ---------- 烤肉線 ---------- */
  bbq: {
    text: "推開院子的鐵門,炭香撲面而來。爸媽和弟妹圍著烤肉架坐好,奶奶正把月餅、柚子擺上供桌準備拜月娘。弟弟把烤肉夾塞進你手裡:「快點,肉要焦了!」",
    choices: [
      { label: "接過夾子,認真幫忙翻烤肉", next: "bbq_help", badge: "認真的你" },
      { label: "趁大家不注意,偷咬一口月餅", next: "bbq_sneak", badge: "調皮的你" }
    ]
  },
  bbq_help: {
    text: "你蹲在爐邊仔細翻著肉,油脂滴在炭火上滋滋作響。弟妹搶著要吃你烤的第一片。",
    choices: [{ label: "繼續烤", next: "bbq_help_praise" }]
  },
  bbq_help_praise: {
    text: "爸爸拍拍你的肩:「手腳比以前俐落多了。」你笑了笑,心裡有點得意。",
    choices: [{ label: "把肉端上桌", next: "bbq_together" }]
  },
  bbq_sneak: {
    text: "你偷偷咬了一口——豆沙甜得剛好。奶奶忽然轉頭看你,你整個人僵住。",
    choices: [{ label: "等奶奶開口", next: "bbq_grandma_mooncake" }]
  },
  bbq_grandma_mooncake: {
    text: "奶奶只是笑了笑:「偷吃的那口最甜,我以前也這樣。」她從口袋摸出一顆自己做的月餅,說要給你。",
    choices: [{ label: "接過月餅,坐回桌邊", next: "bbq_together" }]
  },
  bbq_together: {
    text: "肉烤好了,全家人終於坐下。奶奶把收音機音量調大,一首老歌流洩出來,她跟著哼了兩句,眼神飄向遠方。",
    choices: [
      { label: "問奶奶以前的中秋是什麼樣子", next: "bbq_grandma_story", badge: "好奇的你" },
      { label: "提議大家一起做燈籠", next: "bbq_make_lantern", badge: "動手的你" }
    ]
  },
  bbq_grandma_story: {
    text: "奶奶說起小時候家裡窮,一家七口分吃一顆月餅,那種擠在一起的感覺,比什麼山珍海味都珍貴。",
    choices: [{ label: "靜靜聽完", next: "bbq_moon_rise" }]
  },
  bbq_make_lantern: {
    text: "你和弟妹找出去年剩下的竹篾和玻璃紙,笨拙地糊出一盞歪歪的燈籠,大家笑成一團。",
    choices: [{ label: "把燈籠掛起來", next: "bbq_moon_rise" }]
  },
  bbq_moon_rise: {
    text: "月亮升到院子正上方,又圓又亮。飯桌上的菜涼了一半,但沒有人在意。",
    choices: [
      { label: "提議上頂樓看月亮", next: "bbq_rooftop", badge: "愛冒險的你" },
      { label: "留在院子裡慢慢吃", next: "bbq_yard", badge: "知足的你" }
    ]
  },
  bbq_rooftop: {
    text: "頂樓什麼遮蔽都沒有,月亮幾乎近得像伸手就能摸到。晚風有點涼,你和弟妹靠在一起,誰也沒說話。",
    choices: [{ label: "在這裡多待一會兒", next: "bbq_final" }]
  },
  bbq_yard: {
    text: "你留在院子裡,一口一口把剩下的月餅吃完,聽長輩們閒聊些家常瑣事。",
    choices: [{ label: "夜深了", next: "bbq_final" }]
  },
  bbq_final: {
    text: "夜深了,今晚的最後一刻,你想怎麼度過?",
    choices: [
      { label: "大聲說出今晚的感謝", next: "END:gratitude", badge: "勇敢說愛的你" },
      { label: "只是安靜享受這一刻", next: "END:reunion_quiet", badge: "溫柔沉靜的你" }
    ]
  },

  /* ---------- 賞月線 ---------- */
  walk: {
    text: "河堤邊很安靜,月亮的倒影在水面上輕輕晃著。走著走著,草叢裡竄出一隻通體雪白的兔子,靜靜盯著你看,一點也不怕人。",
    choices: [
      { label: "蹲下來,跟著兔子走進草叢", next: "rabbit", badge: "好奇的你" },
      { label: "不理會兔子,找個地方賞月", next: "moongaze", badge: "沉靜的你" }
    ]
  },
  rabbit: {
    text: "兔子領著你穿過芒草叢,眼前出現一道發亮的月光門,門後傳來搗藥的節奏聲和淡淡桂花香。",
    choices: [
      { label: "推開月光門走進去", next: "chang_e", badge: "勇敢的你" },
      { label: "笑著搖搖頭,轉身離開", next: "END:homeward", badge: "念舊的你" }
    ]
  },
  chang_e: {
    text: "門後是灑滿月光的庭院,一位女子正在搗藥,她抬頭看你,彷彿早知道你會來:「每年這一晚,月門都會開一次。」",
    choices: [{ label: "接過她遞來的桂花酒", next: "chang_e_talk" }]
  },
  chang_e_talk: {
    text: "「大部分人站在門口猶豫,最後還是轉身回去了——你想留下來,聽我說說這幾千年的月亮上,都發生過什麼事嗎?」",
    choices: [
      { label: "留下來聽她說故事", next: "END:legend", badge: "嚮往傳說的你" },
      { label: "想了想,還是決定回家", next: "END:homeward2", badge: "眷戀人間的你" }
    ]
  },
  moongaze: {
    text: "你在堤岸坐下,水面被月光切成一片片碎銀。老一輩說,中秋夜對月亮許願特別容易實現。",
    choices: [
      { label: "許一個藏在心裡很久的願望", next: "wish", badge: "敢許願的你" },
      { label: "什麼都不求,只是發呆", next: "peace", badge: "隨遇而安的你" }
    ]
  },
  wish: { isWishInput: true },
  peace: {
    text: "你沒有許願,只是看著月亮一點一點爬向天頂,雲絲偶爾飄過。",
    choices: [{ label: "口袋裡的手機震動了一下", next: "peace_deepen" }]
  },
  peace_deepen: {
    text: "是家人問你在哪,你回了一句「在賞月,等等回去」,然後把手機收了起來。",
    choices: [{ label: "多留一會兒", next: "END:peace" }]
  }
};

const endings = {
  gratitude:    { title: "結局:說出口的愛", rating:"稱號｜把溫暖說出口的人", desc: "你把感謝說出了口,家人愣了一下,隨即笑得比月亮還亮。" },
  reunion_quiet:{ title: "結局:安靜的圓滿", rating:"稱號｜珍惜此刻的人", desc: "你什麼都沒說,只是靜靜坐著,而這份安靜本身,就是最好的團圓。" },
  legend:       { title: "結局:月門那端", rating:"稱號｜月宮訪客", desc: "你是少數願意留下的人,這個中秋,你的故事和月亮一樣,將被靜靜記得。" },
  homeward2:    { title: "結局:眷戀人間", rating:"稱號｜記得回家的人", desc: "傳說再美,你還是選擇回到人間——那裡有等你回去的燈火。" },
  homeward:     { title: "結局:歸途", rating:"稱號｜循著燈火回家的人", desc: "你沒有走進月光門,遠遠看見自家陽台的燈還亮著,那盞燈比任何傳說都珍貴。" },
  hope:         { title: "結局:許願", rating:"稱號｜把心願交給月亮的人", desc: "你把心裡的話說給了月亮聽,帶著一點微小卻真實的希望走回人間。" },
  peace:        { title: "結局:靜好", rating:"稱號｜與月光同行的人", desc: "不求什麼,只是好好活在這一刻——這也是屬於你自己的圓滿。" },
  hidden:       { title: "隱藏結局:月下團圓", rating:"稱號｜集齊月光的人", desc:"你走過每一段不同的中秋夜，月亮記住了你的所有選擇。今晚，所有故事在同一輪月光下相遇。" }
};

/* ---------- 引擎 ---------- */
const card = document.getElementById('card');
let memories = [];
let stepCount = 0;
const UNLOCK_KEY = 'moon-festival-unlocked-endings';
const RECORD_KEY = 'moon-festival-records-v2';
const MISSIONS = [
  { text: '收集至少 2 個回憶徽章', test: run => run.memories.length >= 2 },
  { text: '走進月光門，看看傳說的另一端', test: run => run.visited.includes('chang_e') },
  { text: '選擇一個溫柔的夜晚結局', test: run => ['peace','reunion_quiet','homeward','homeward2'].includes(run.ending) },
  { text: '在故事中做出至少 5 次選擇', test: run => run.steps >= 5 },
  { text: '找到一個平常不會走的分支', test: run => run.visited.includes('rabbit') || run.visited.includes('bbq_make_lantern') }
];
let mission = MISSIONS[Math.floor(Math.random() * MISSIONS.length)];
let visited = [];
let playerName = '';
let storyLog = [];
let currentRunSaved = false;

function getUnlocked(){
  try { return JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]'); }
  catch(e){ return []; }
}
function unlockEnding(id){
  try {
    const list = getUnlocked();
    if (!list.includes(id)) { list.push(id); localStorage.setItem(UNLOCK_KEY, JSON.stringify(list)); }
  } catch(e){ /* localStorage 不可用時安靜略過 */ }
}

function getRecords(){
  try { return JSON.parse(localStorage.getItem(RECORD_KEY) || '{"plays":0,"best":0,"wishLights":0,"endings":[]}'); }
  catch(e){ return {plays:0,best:0,wishLights:0,endings:[]}; }
}
function saveEnding(id){
  const records = getRecords();
  records.plays += 1;
  records.best = Math.max(records.best, memories.length);
  if (!records.endings.includes(id)) records.endings.push(id);
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch(e) {}
  return records;
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function lightLantern(){
  const records=getRecords(); records.wishLights=(records.wishLights||0)+1;
  try{localStorage.setItem(RECORD_KEY,JSON.stringify(records));}catch(e){}
  const layer=document.createElement('div');layer.className='celebrate';layer.setAttribute('aria-hidden','true');
  ['🏮','✨','🌕','🎐','⭐'].forEach((symbol,i)=>{const item=document.createElement('i');item.textContent=symbol;item.style.left=(12+i*18)+'%';item.style.animationDelay=(i*.13)+'s';layer.appendChild(item)});
  document.body.appendChild(layer);setTimeout(()=>layer.remove(),3400);
  const button=document.getElementById('lanternBtn');if(button){button.textContent='願望已乘著燈火升起';button.disabled=true;button.setAttribute('aria-pressed','true');}
}

function incrementEndingRemote(id){
  // 統計功能是加分項,不是核心體驗:失敗或沒設定 WORKER_URL 時安靜略過,不影響故事本身。
  if (!CONFIG.WORKER_URL || CONFIG.WORKER_URL.includes("YOUR-SUBDOMAIN")) return;
  fetch(CONFIG.WORKER_URL + "/increment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ending: id })
  }).catch(() => { /* 離線或伺服器暫時不可用,不影響使用者體驗 */ });
}

async function fetchStats(){
  if (!CONFIG.WORKER_URL || CONFIG.WORKER_URL.includes("YOUR-SUBDOMAIN")) return null;
  try {
    const res = await fetch(CONFIG.WORKER_URL + "/stats");
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

async function saveStoryRecord(record){
  try { const list=JSON.parse(localStorage.getItem('moon-festival-story-log')||'[]'); list.unshift(record); localStorage.setItem('moon-festival-story-log',JSON.stringify(list.slice(0,50))); } catch(e){}
  if(!CONFIG.WORKER_URL||CONFIG.WORKER_URL.includes('YOUR-SUBDOMAIN')) return;
  try { await fetch(CONFIG.WORKER_URL+'/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)}); } catch(e){}
}
async function fetchStoryRecords(){
  if(!CONFIG.WORKER_URL||CONFIG.WORKER_URL.includes('YOUR-SUBDOMAIN')) return null;
  try { const res=await fetch(CONFIG.WORKER_URL+'/stories'); if(!res.ok)return null; return await res.json(); } catch(e){return null;}
}
function renderPlayerEntry(){
  card.innerHTML=`<h1>月圓之夜</h1><p class="subtitle">先留下你的名稱，再開始今晚的故事。</p><label for="playerNameInput">玩家名稱</label><input class="wish-input" id="playerNameInput" maxlength="24" autocomplete="nickname" placeholder="輸入你想使用的名稱"><div class="choices"><button class="choice" id="enterStoryBtn">進入故事</button></div><button class="stats-link" id="entryStoriesBtn" style="margin-top:18px;">查看玩家結局與故事紀錄</button>`;
  const input=document.getElementById('playerNameInput');
  document.getElementById('enterStoryBtn').addEventListener('click',()=>{playerName=input.value.trim().slice(0,24)||'月光旅人';memories=[];stepCount=0;visited=[];storyLog=[];currentRunSaved=false;window.__moonStorySaved=false;mission=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];render('start');});
  input.addEventListener('keydown',event=>{if(event.key==='Enter')document.getElementById('enterStoryBtn').click();});
  document.getElementById('entryStoriesBtn').addEventListener('click',()=>renderStats(null));
}

function renderEnding(id){
  const ending = endings[id];
  if(id==='hidden'&&!getUnlocked().includes('hidden'))unlockEnding('hidden');
  const firstRender=!currentRunSaved;
  if(firstRender){unlockEnding(id);incrementEndingRemote(id);saveEnding(id);currentRunSaved=true;}
  const records=getRecords();
  if(firstRender)saveStoryRecord({player:playerName||'月光旅人',ending:id,endingTitle:ending.title,description:ending.desc,path:storyLog.slice(),memories:memories.slice(),date:new Date().toISOString()});
  const missionDone=mission.test({memories,visited,ending:id,steps:stepCount});
  const allEndings=[...new Set([...getUnlocked(),id])];
  const regularEndingCount=Object.keys(endings).length-1;
  const secretUnlocked=Object.keys(endings).filter(key=>key!=='hidden').every(key=>allEndings.includes(key));
  const badgeHtml = memories.length
    ? `<div class="memories">${memories.map(m => `<span>${m}</span>`).join('')}</div>`
    : '';
  card.innerHTML = `
    <div class="ending-scene" aria-hidden="true"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></div>
    <span class="ending-tag">${ending.title}</span>
    <strong class="ending-title">${ending.rating}</strong>
    <p style="color:var(--ink-dim);font-size:1.02rem;margin-bottom:6px;">${ending.desc}</p>
    <div class="record-line">玩家：${escapeHtml(playerName||'月光旅人')}<br>本輪故事：${storyLog.map(escapeHtml).join(' → ')||'月色中的一段旅程'} → ${escapeHtml(ending.title.replace('結局:','').replace('隱藏結局:',''))}</div>
    <div class="score-line">本次收集 ${memories.length} 個回憶徽章 · ${missionDone ? '任務完成！' : '再玩一次挑戰任務'}<br>${missionDone ? '🌟 ' + mission.text : '🎯 ' + mission.text}</div>
    ${badgeHtml}
    ${id==='hidden' ? '<p class="wish-result">你點亮了所有回憶，整片夜空都為你亮起。</p>' : ''}
    <div class="record-line">遊玩 ${records.plays} 次 · 最多收集 ${records.best} 個回憶 · 已解鎖 ${allEndings.filter(key=>key!=='hidden').length} / ${regularEndingCount} 個一般結局${allEndings.includes('hidden') ? ' · 隱藏結局已解鎖' : ''}${secretUnlocked && !allEndings.includes('hidden') ? '<br>月色深處似乎還藏著一段故事……' : ''}</div>
    ${secretUnlocked && !allEndings.includes('hidden') ? '<button class="secondary" id="secretBtn" style="width:100%;margin:0 0 12px;">追尋月色深處的故事</button>' : ''}
    <div class="ending-actions"><button class="secondary" id="lanternBtn" aria-pressed="false">點亮一盞願望燈</button><button class="secondary" id="memoryBtn">分享本次回憶</button></div>
    <button class="restart" id="restartBtn">重新開始這個中秋夜</button>
    <button class="stats-link" id="viewStatsBtn" style="margin-top:14px;">看看其他玩家的結局與故事</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    memories = []; stepCount = 0; visited=[]; storyLog=[];currentRunSaved=false;mission=MISSIONS[Math.floor(Math.random()*MISSIONS.length)]; render('start');
  });
  document.getElementById('lanternBtn').addEventListener('click',lightLantern);
  const secretBtn=document.getElementById('secretBtn');if(secretBtn)secretBtn.addEventListener('click',()=>renderEnding('hidden'));
  document.getElementById('memoryBtn').addEventListener('click',async()=>{
    const text=`我在《月圓之夜》走到了「${ending.title.replace('結局:','')}」，收集了 ${memories.length} 個回憶徽章。`;
    try{await navigator.clipboard.writeText(text);document.getElementById('memoryBtn').textContent='回憶已複製';}catch(e){document.getElementById('memoryBtn').textContent=text;}
  });
  document.getElementById('viewStatsBtn').addEventListener('click', () => renderStats(id));
}

async function renderStats(returnToEnding){
  card.innerHTML = `<p class="story-text">讀取統計中…</p>`;
  const data = await fetchStats();

  if (!data) {
    card.innerHTML = `
      <h1 style="font-size:1.3rem;">結局統計</h1>
      <p class="story-text" style="font-size:1rem;color:var(--ink-dim);">目前無法連線到統計伺服器,可能是還沒設定,或暫時離線,稍後再試看看。</p>
      <button class="restart" id="backBtn">返回</button>
    `;
  } else {
    const total = Object.values(data).reduce((a, b) => a + b, 0) || 1;
    const rows = Object.entries(data)
      .sort((a, b) => b[1] - a[1])
      .map(([id, count]) => {
        const pct = Math.round((count / total) * 100);
        const title = endings[id] ? endings[id].title.replace('結局:', '') : id;
        return `
          <div class="stat-row">
            <div class="stat-label"><span>${title}</span><span>${count} 次</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;"></div></div>
          </div>`;
      }).join('');

    card.innerHTML = `
      <h1 style="font-size:1.3rem;margin-bottom:4px;">結局統計</h1>
      <p class="unlock-line" style="margin-bottom:24px;">全部玩家累積抵達結局共 ${total} 次</p>
      ${rows}
      <button class="restart" id="backBtn" style="margin-top:22px;">返回</button>
    `;
  }

  let storyRecords=await fetchStoryRecords();
  if(!storyRecords){try{storyRecords=JSON.parse(localStorage.getItem('moon-festival-story-log')||'[]');}catch(e){storyRecords=[];}}
  const storySection=document.createElement('section');
  storySection.innerHTML=`<h2 style="font-size:1.15rem;color:var(--moon);margin-top:26px;">玩家故事紀錄</h2>${storyRecords.slice(0,20).map(item=>`<div class="record-line"><strong>${escapeHtml(item.player||'月光旅人')}</strong> · ${escapeHtml(item.endingTitle||item.ending||'中秋夜')}<br><small>${escapeHtml(item.date?new Date(item.date).toLocaleString():'')}</small><br>${(item.path||[]).map(escapeHtml).join(' → ')||escapeHtml(item.description||'')}</div>`).join('')||'<p class="stats-note">還沒有玩家留下故事紀錄。</p>'}`;
  card.insertBefore(storySection,document.getElementById('backBtn'));

  document.getElementById('backBtn').addEventListener('click', () => {
    if (returnToEnding) { renderEnding(returnToEnding); } else if(playerName) { render('start'); } else { renderPlayerEntry(); }
  });
}

function renderWish(){
  stepCount += 1;
  card.innerHTML = `
    <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
    <h1>許願</h1>
    <p class="story-text">月光靜靜灑下來。閉上眼睛,把心裡那句話寫下來——</p>
    <input class="wish-input" id="wishInput" maxlength="60" placeholder="輸入你想許的願望...">
    <div class="choices"><button class="choice" id="wishSubmit">許下這個願望</button></div>
  `;
  document.getElementById('wishSubmit').addEventListener('click', () => {
    const val = escapeHtml(document.getElementById('wishInput').value.trim() || "一個沒有說出口、只有自己知道的願望");
    storyLog.push('許下願望：'+val);
    stepCount += 1;
    card.innerHTML = `
      <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
      <div class="story-text">你在心裡把「${val}」一字一句慢慢說了一遍。一陣風忽然吹過堤岸的芒草,沙沙作響,你分不清是巧合,還是月亮真的聽見了。</div>
      <div class="choices"><button class="choice" id="wishContinue">起身,往回家的路走去</button></div>
    `;
    document.getElementById('wishContinue').addEventListener('click', () => renderEnding('hope'));
  });
}

function render(nodeKey){
  if (nodeKey.startsWith('END:')) { const id=nodeKey.slice(4); if(id==='hidden' || getUnlocked().length>=Object.keys(endings).length){renderEnding('hidden');}else{renderEnding(id);} return; }
  visited.push(nodeKey);
  const node = story[nodeKey];
  if (node.isWishInput) { renderWish(); return; }

  stepCount += 1;
  card.innerHTML = `
    <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
    ${nodeKey === 'start' ? renderStartHeader() : ''}
    <div class="story-text">${node.text}</div>
    <div class="choices">
      ${node.choices.map(c => `<button class="choice" data-next="${c.next}" data-badge="${c.badge || ''}">${c.label}</button>`).join('')}
    </div>
  `;
  card.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.badge) memories.push(btn.dataset.badge);
      storyLog.push(btn.textContent.trim());
      render(btn.dataset.next);
    });
  });

  if (nodeKey === 'start') {
    const statsBtn = document.getElementById('startStatsBtn');
    if (statsBtn) statsBtn.addEventListener('click', () => renderStats(null));
  }
}

function renderStartHeader(){
  const unlocked = getUnlocked().length;
  const total = Object.keys(endings).length;
  return `<h1>月圓之夜</h1>
    <p class="subtitle">一個中秋夜的分支故事 · 你的選擇決定結局</p>
    <p class="unlock-line">已解鎖 ${unlocked} / ${total} 個結局</p>
    <div class="mission-box"><strong>本輪月光任務</strong><br>${mission.text}</div>
    <button class="stats-link" id="startStatsBtn">看看其他玩家都選了什麼結局</button>`;
}

renderPlayerEntry();
</script>
</body>
</html>
