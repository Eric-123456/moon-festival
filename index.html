<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月圓之夜 · 互動故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161829; --bg2:#1f2140; --card:#20223d;
    --moon:#e8c872; --lantern:#c8553d; --ink:#f2e9d8; --ink-dim:#b9b3c9; --border:#3a3d63;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; background:var(--bg); font-family:'Noto Serif TC', serif; color:var(--ink); }
  body{ position:relative; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:48px 20px; overflow-x:hidden; }
  .sky{ position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 82% 12%, rgba(232,200,114,0.32), rgba(232,200,114,0) 45%),
      radial-gradient(ellipse at 50% 100%, var(--bg2), var(--bg) 70%); }
  .moon{ position:fixed; top:7%; right:9%; width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6da, var(--moon) 60%, #c9a24f 100%);
    box-shadow:0 0 70px 12px rgba(232,200,114,0.35); z-index:0; }
  .stars{ position:fixed; inset:0; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 12%, #fff, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 85% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 92% 25%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, #fff, transparent);
    opacity:0.6; animation:twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle{ from{opacity:.35;} to{opacity:.75;} }
  .decor{ position:fixed; top:0; bottom:0; width:180px; z-index:0; pointer-events:none; }
  .decor.left{ left:0; } .decor.right{ right:0; }
  .decor svg{ position:absolute; opacity:.55; animation:float 7s ease-in-out infinite; }
  .decor.left svg:nth-child(1){ top:8%;  left:18px; width:64px; animation-delay:0s; }
  .decor.left svg:nth-child(2){ top:42%; left:46px; width:52px; animation-delay:1.5s; }
  .decor.left svg:nth-child(3){ top:76%; left:10px; width:58px; animation-delay:3s; }
  .decor.right svg:nth-child(1){ top:14%; right:20px; width:58px; animation-delay:.8s; }
  .decor.right svg:nth-child(2){ top:48%; right:44px; width:66px; animation-delay:2.2s; }
  .decor.right svg:nth-child(3){ top:80%; right:14px; width:50px; animation-delay:3.6s; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @media (max-width: 1180px){ .decor{ display:none; } }

  main{ position:relative; z-index:1; width:100%; max-width:760px; }
  .card{ background:linear-gradient(180deg, var(--card), #191b34); border:1px solid var(--border); border-radius:20px;
    padding:52px 56px; box-shadow:0 24px 70px rgba(0,0,0,0.45); animation:fadein .5s ease both; }
  @keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  h1{ margin:0 0 8px; font-size:1.9rem; font-weight:700; letter-spacing:.04em; color:var(--moon); }
  .subtitle{ margin:0 0 8px; font-size:.92rem; color:var(--ink-dim); }
  .unlock-line{ margin:0 0 26px; font-size:.85rem; color:var(--lantern); }
  .story-text{ font-size:1.14rem; line-height:1.95; white-space:pre-line; margin-bottom:30px; }
  .choices{ display:flex; flex-direction:column; gap:14px; }
  button.choice{ text-align:left; background:#262848; color:var(--ink); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; font-family:inherit; font-size:1.04rem; line-height:1.6; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .15s ease; }
  button.choice:hover{ border-color:var(--moon); background:#2c2f58; transform:translateX(3px); }
  button.choice:focus-visible{ outline:2px solid var(--moon); outline-offset:2px; }
  .ending-tag{ display:inline-block; font-size:.8rem; color:var(--lantern); border:1px solid var(--lantern);
    border-radius:999px; padding:4px 14px; margin-bottom:18px; letter-spacing:.06em; }
  .memories{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 26px; }
  .memories span{ font-size:.82rem; color:var(--moon); border:1px solid var(--moon); border-radius:999px; padding:4px 12px; opacity:.9; }
  button.restart{ margin-top:4px; width:100%; background:var(--lantern); color:#fff6ea; border:none; border-radius:12px;
    padding:15px 18px; font-family:inherit; font-size:1.05rem; cursor:pointer; transition:filter .15s ease; }
  button.restart:hover{ filter:brightness(1.1); }
  .step-label{ font-size:.8rem; color:var(--ink-dim); margin-bottom:16px; letter-spacing:.05em; }
  .wish-input{ width:100%; background:#161829; color:var(--ink); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; font-family:inherit; font-size:1.02rem; margin-bottom:14px; }
  .wish-input:focus-visible{ outline:2px solid var(--moon); }
  @media (max-width:640px){ .card{ padding:32px 24px; } h1{ font-size:1.5rem; } .story-text{ font-size:1.02rem; line-height:1.85; } }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } .stars{ animation:none; } .decor svg{ animation:none; } }
</style>
</head>
<body>
  <div class="sky"></div><div class="stars"></div><div class="moon"></div>

  <div class="decor left">
    <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--lantern)" stroke-width="2">
      <line x1="30" y1="2" x2="30" y2="12"/><rect x="16" y="12" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/>
      <path d="M16 18 C10 30 10 55 16 66 L44 66 C50 55 50 30 44 18 Z"/>
      <line x1="20" y1="22" x2="20" y2="62"/><line x1="30" y1="22" x2="30" y2="62"/><line x1="40" y1="22" x2="40" y2="62"/>
      <rect x="16" y="66" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/><line x1="30" y1="72" x2="30" y2="84"/>
    </svg>
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--moon)" stroke-width="2">
      <path d="M6 54 C20 40 20 20 30 6" stroke-linecap="round"/>
      <circle cx="14" cy="42" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="20" cy="30" r="3.2" fill="var(--moon)" stroke="none"/>
      <circle cx="26" cy="18" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="30" cy="6" r="3.2" fill="var(--moon)" stroke="none"/>
    </svg>
    <svg viewBox="0 0 70 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--ink-dim)" stroke-width="2">
      <ellipse cx="34" cy="40" rx="22" ry="15"/><circle cx="20" cy="22" r="10"/>
      <path d="M14 16 C10 4 16 2 18 12" stroke-linecap="round"/><path d="M24 16 C24 2 30 2 28 12" stroke-linecap="round"/>
      <circle cx="16" cy="22" r="1.6" fill="var(--ink-dim)" stroke="none"/>
    </svg>
  </div>
  <div class="decor right">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--moon)" stroke-width="2">
      <rect x="6" y="6" width="48" height="48" rx="8"/><circle cx="30" cy="30" r="12"/>
      <path d="M30 6 V54 M6 30 H54" stroke-width="1" opacity=".5"/>
    </svg>
    <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--lantern)" stroke-width="2">
      <line x1="30" y1="2" x2="30" y2="12"/><rect x="16" y="12" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/>
      <path d="M16 18 C10 30 10 55 16 66 L44 66 C50 55 50 30 44 18 Z"/>
      <line x1="20" y1="22" x2="20" y2="62"/><line x1="30" y1="22" x2="30" y2="62"/><line x1="40" y1="22" x2="40" y2="62"/>
      <rect x="16" y="66" width="28" height="6" rx="2" fill="var(--lantern)" stroke="none"/><line x1="30" y1="72" x2="30" y2="84"/>
    </svg>
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--moon)" stroke-width="2">
      <path d="M54 54 C40 40 40 20 30 6" stroke-linecap="round"/>
      <circle cx="46" cy="42" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="40" cy="30" r="3.2" fill="var(--moon)" stroke="none"/>
      <circle cx="34" cy="18" r="3.2" fill="var(--moon)" stroke="none"/><circle cx="30" cy="6" r="3.2" fill="var(--moon)" stroke="none"/>
    </svg>
  </div>

  <main><div class="card" id="card"></div></main>

<script>
const story = {
  start: {
    text: "中秋夜,天色一點一點沉下來。月亮從對面屋簷後探出半張臉,巷子裡飄來炭火的煙味,鄰居的燈籠一盞一盞亮起。\n\n你站在自家門口,手裡拎著一盒月餅。今晚,你得決定要怎麼過。",
    choices: [
      { label: "回家和家人一起烤肉、拜月娘", next: "bbq" },
      { label: "一個人到河堤走走,靜靜賞月", next: "walk" }
    ]
  },

  /* ---------- 烤肉線 ---------- */
  bbq: {
    text: "推開院子的鐵門,炭香撲面而來。爸媽和弟妹圍著烤肉架坐好,奶奶正把月餅、柚子擺上供桌準備拜月娘。弟弟把烤肉夾塞進你手裡:「快點,肉要焦了!」",
    choices: [
      { label: "接過夾子,認真幫忙翻烤肉", next: "bbq_help", badge: "認真的你" },
      { label: "趁大家不注意,偷咬一口月餅", next: "bbq_sneak", badge: "調皮的你" }
    ]
  },
  bbq_help: {
    text: "你蹲在爐邊仔細翻著肉,油脂滴在炭火上滋滋作響。弟妹搶著要吃你烤的第一片。",
    choices: [{ label: "繼續烤", next: "bbq_help_praise" }]
  },
  bbq_help_praise: {
    text: "爸爸拍拍你的肩:「手腳比以前俐落多了。」你笑了笑,心裡有點得意。",
    choices: [{ label: "把肉端上桌", next: "bbq_together" }]
  },
  bbq_sneak: {
    text: "你偷偷咬了一口——豆沙甜得剛好。奶奶忽然轉頭看你,你整個人僵住。",
    choices: [{ label: "等奶奶開口", next: "bbq_grandma_mooncake" }]
  },
  bbq_grandma_mooncake: {
    text: "奶奶只是笑了笑:「偷吃的那口最甜,我以前也這樣。」她從口袋摸出一顆自己做的月餅,說要給你。",
    choices: [{ label: "接過月餅,坐回桌邊", next: "bbq_together" }]
  },
  bbq_together: {
    text: "肉烤好了,全家人終於坐下。奶奶把收音機音量調大,一首老歌流洩出來,她跟著哼了兩句,眼神飄向遠方。",
    choices: [
      { label: "問奶奶以前的中秋是什麼樣子", next: "bbq_grandma_story", badge: "好奇的你" },
      { label: "提議大家一起做燈籠", next: "bbq_make_lantern", badge: "動手的你" }
    ]
  },
  bbq_grandma_story: {
    text: "奶奶說起小時候家裡窮,一家七口分吃一顆月餅,那種擠在一起的感覺,比什麼山珍海味都珍貴。",
    choices: [{ label: "靜靜聽完", next: "bbq_moon_rise" }]
  },
  bbq_make_lantern: {
    text: "你和弟妹找出去年剩下的竹篾和玻璃紙,笨拙地糊出一盞歪歪的燈籠,大家笑成一團。",
    choices: [{ label: "把燈籠掛起來", next: "bbq_moon_rise" }]
  },
  bbq_moon_rise: {
    text: "月亮升到院子正上方,又圓又亮。飯桌上的菜涼了一半,但沒有人在意。",
    choices: [
      { label: "提議上頂樓看月亮", next: "bbq_rooftop", badge: "愛冒險的你" },
      { label: "留在院子裡慢慢吃", next: "bbq_yard", badge: "知足的你" }
    ]
  },
  bbq_rooftop: {
    text: "頂樓什麼遮蔽都沒有,月亮幾乎近得像伸手就能摸到。晚風有點涼,你和弟妹靠在一起,誰也沒說話。",
    choices: [{ label: "在這裡多待一會兒", next: "bbq_final" }]
  },
  bbq_yard: {
    text: "你留在院子裡,一口一口把剩下的月餅吃完,聽長輩們閒聊些家常瑣事。",
    choices: [{ label: "夜深了", next: "bbq_final" }]
  },
  bbq_final: {
    text: "夜深了,今晚的最後一刻,你想怎麼度過?",
    choices: [
      { label: "大聲說出今晚的感謝", next: "END:gratitude", badge: "勇敢說愛的你" },
      { label: "只是安靜享受這一刻", next: "END:reunion_quiet", badge: "溫柔沉靜的你" }
    ]
  },

  /* ---------- 賞月線 ---------- */
  walk: {
    text: "河堤邊很安靜,月亮的倒影在水面上輕輕晃著。走著走著,草叢裡竄出一隻通體雪白的兔子,靜靜盯著你看,一點也不怕人。",
    choices: [
      { label: "蹲下來,跟著兔子走進草叢", next: "rabbit", badge: "好奇的你" },
      { label: "不理會兔子,找個地方賞月", next: "moongaze", badge: "沉靜的你" }
    ]
  },
  rabbit: {
    text: "兔子領著你穿過芒草叢,眼前出現一道發亮的月光門,門後傳來搗藥的節奏聲和淡淡桂花香。",
    choices: [
      { label: "推開月光門走進去", next: "chang_e", badge: "勇敢的你" },
      { label: "笑著搖搖頭,轉身離開", next: "END:homeward", badge: "念舊的你" }
    ]
  },
  chang_e: {
    text: "門後是灑滿月光的庭院,一位女子正在搗藥,她抬頭看你,彷彿早知道你會來:「每年這一晚,月門都會開一次。」",
    choices: [{ label: "接過她遞來的桂花酒", next: "chang_e_talk" }]
  },
  chang_e_talk: {
    text: "「大部分人站在門口猶豫,最後還是轉身回去了——你想留下來,聽我說說這幾千年的月亮上,都發生過什麼事嗎?」",
    choices: [
      { label: "留下來聽她說故事", next: "END:legend", badge: "嚮往傳說的你" },
      { label: "想了想,還是決定回家", next: "END:homeward2", badge: "眷戀人間的你" }
    ]
  },
  moongaze: {
    text: "你在堤岸坐下,水面被月光切成一片片碎銀。老一輩說,中秋夜對月亮許願特別容易實現。",
    choices: [
      { label: "許一個藏在心裡很久的願望", next: "wish", badge: "敢許願的你" },
      { label: "什麼都不求,只是發呆", next: "peace", badge: "隨遇而安的你" }
    ]
  },
  wish: { isWishInput: true },
  peace: {
    text: "你沒有許願,只是看著月亮一點一點爬向天頂,雲絲偶爾飄過。",
    choices: [{ label: "口袋裡的手機震動了一下", next: "peace_deepen" }]
  },
  peace_deepen: {
    text: "是家人問你在哪,你回了一句「在賞月,等等回去」,然後把手機收了起來。",
    choices: [{ label: "多留一會兒", next: "END:peace" }]
  }
};

const endings = {
  gratitude:    { title: "結局:說出口的愛", desc: "你把感謝說出了口,家人愣了一下,隨即笑得比月亮還亮。" },
  reunion_quiet:{ title: "結局:安靜的圓滿", desc: "你什麼都沒說,只是靜靜坐著,而這份安靜本身,就是最好的團圓。" },
  legend:       { title: "結局:月門那端",   desc: "你是少數願意留下的人,這個中秋,你的故事和月亮一樣,將被靜靜記得。" },
  homeward2:    { title: "結局:眷戀人間",   desc: "傳說再美,你還是選擇回到人間——那裡有等你回去的燈火。" },
  homeward:     { title: "結局:歸途",       desc: "你沒有走進月光門,遠遠看見自家陽台的燈還亮著,那盞燈比任何傳說都珍貴。" },
  hope:         { title: "結局:許願",       desc: "你把心裡的話說給了月亮聽,帶著一點微小卻真實的希望走回人間。" },
  peace:        { title: "結局:靜好",       desc: "不求什麼,只是好好活在這一刻——這也是屬於你自己的圓滿。" }
};

/* ---------- 引擎 ---------- */
const card = document.getElementById('card');
let memories = [];
let stepCount = 0;
const UNLOCK_KEY = 'moon-festival-unlocked-endings';

function getUnlocked(){
  try { return JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]'); }
  catch(e){ return []; }
}
function unlockEnding(id){
  try {
    const list = getUnlocked();
    if (!list.includes(id)) { list.push(id); localStorage.setItem(UNLOCK_KEY, JSON.stringify(list)); }
  } catch(e){ /* localStorage 不可用時安靜略過 */ }
}

function renderEnding(id){
  const ending = endings[id];
  unlockEnding(id);
  const badgeHtml = memories.length
    ? `<div class="memories">${memories.map(m => `<span>${m}</span>`).join('')}</div>`
    : '';
  card.innerHTML = `
    <span class="ending-tag">${ending.title}</span>
    <p style="color:var(--ink-dim);font-size:1.02rem;margin-bottom:6px;">${ending.desc}</p>
    ${badgeHtml}
    <button class="restart" id="restartBtn">重新開始這個中秋夜</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    memories = []; stepCount = 0; render('start');
  });
}

function renderWish(){
  stepCount += 1;
  card.innerHTML = `
    <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
    <h1>許願</h1>
    <p class="story-text">月光靜靜灑下來。閉上眼睛,把心裡那句話寫下來——</p>
    <input class="wish-input" id="wishInput" maxlength="60" placeholder="輸入你想許的願望...">
    <div class="choices"><button class="choice" id="wishSubmit">許下這個願望</button></div>
  `;
  document.getElementById('wishSubmit').addEventListener('click', () => {
    const val = document.getElementById('wishInput').value.trim() || "一個沒有說出口、只有自己知道的願望";
    stepCount += 1;
    card.innerHTML = `
      <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
      <div class="story-text">你在心裡把「${val}」一字一句慢慢說了一遍。一陣風忽然吹過堤岸的芒草,沙沙作響,你分不清是巧合,還是月亮真的聽見了。</div>
      <div class="choices"><button class="choice" id="wishContinue">起身,往回家的路走去</button></div>
    `;
    document.getElementById('wishContinue').addEventListener('click', () => renderEnding('hope'));
  });
}

function render(nodeKey){
  if (nodeKey.startsWith('END:')) { renderEnding(nodeKey.slice(4)); return; }
  const node = story[nodeKey];
  if (node.isWishInput) { renderWish(); return; }

  stepCount += 1;
  card.innerHTML = `
    <div class="step-label">第 ${stepCount} 段 · 中秋夜</div>
    ${nodeKey === 'start' ? renderStartHeader() : ''}
    <div class="story-text">${node.text}</div>
    <div class="choices">
      ${node.choices.map(c => `<button class="choice" data-next="${c.next}" data-badge="${c.badge || ''}">${c.label}</button>`).join('')}
    </div>
  `;
  card.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.badge) memories.push(btn.dataset.badge);
      render(btn.dataset.next);
    });
  });
}

function renderStartHeader(){
  const unlocked = getUnlocked().length;
  const total = Object.keys(endings).length;
  return `<h1>月圓之夜</h1>
    <p class="subtitle">一個中秋夜的分支故事 · 你的選擇決定結局</p>
    <p class="unlock-line">已解鎖 ${unlocked} / ${total} 個結局</p>`;
}

render('start');
</script>
</body>
</html>
